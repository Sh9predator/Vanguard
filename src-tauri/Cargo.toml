[package]
name = "vanguard"
version = "0.1.0"
description = "Minimal system and process monitor"
edition = "2021"
rust-version = "1.77"

# Keeps Cargo from picking up a stray Cargo.toml in a parent folder.
[workspace]

[lib]
name = "vanguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-single-instance = "2"
# Loads the NVIDIA driver's NVML at runtime; nothing is linked, so non-NVIDIA PCs are unaffected.
nvml-wrapper = "0.10"
# Pinned minor: refresh_* signatures change between sysinfo minors, and Disk::usage needs 0.33+. rayon ("multithread") is off on purpose.
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
